name: Generate Release Keystore (run once)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias signalapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass SignalApp2026 \
            -keypass SignalApp2026 \
            -dname "CN=SignalApp, OU=Dev, O=SignalApp, L=Colombo, S=Western, C=LK"

      - name: Show SHA1 and SHA256 fingerprints
        run: |
          echo "===== COPY THE SHA1 LINE BELOW ====="
          keytool -list -v -keystore release.keystore -alias signalapp -storepass SignalApp2026

      - name: Base64 encode keystore
        run: base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.base64.txt
